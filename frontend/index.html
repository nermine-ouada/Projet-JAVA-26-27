<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Club Atlas, salle de sport</title>
    <script>
      // Applique le theme avant l'affichage : clair par defaut, sombre ou auto si choisi
      var t = 'light'
      try { t = localStorage.getItem('club-atlas-theme') || 'light' } catch (e) {}
      document.documentElement.setAttribute('data-theme', t === 'dark' || t === 'auto' ? t : 'light')
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
